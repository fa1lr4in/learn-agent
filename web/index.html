<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="api-token" content="">
  <meta name="workspace" content="">
  <title>learn-agent · 工作台</title>
  <script src="/assets/theme.js"></script>
  <link rel="stylesheet" href="/assets/styles.css">
  <script type="module" src="/assets/app.js"></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="项目与会话">
      <div class="brand">learn-agent<span class="demo-badge">本地</span></div>
      <button id="new-task" class="new-task" type="button"><span aria-hidden="true">＋</span> 新建会话</button>
      <p class="section-label">历史会话</p>
      <nav id="sessions" class="sessions" aria-label="历史会话"></nav>
      <div class="project"><p class="section-label">当前项目</p><p id="project-path" class="project-name"></p></div>
      <div id="connection" class="sidebar-note" role="status">正在连接本地服务</div>
    </aside>
    <main class="workspace">
      <header class="topbar">
        <h1 id="project-title">工作台</h1>
        <div class="topbar-actions">
          <span id="task-status" class="task-status" role="status">连接中</span>
          <label class="sr-only" for="theme">外观主题</label>
          <select id="theme" class="theme-select"><option value="system">跟随系统</option><option value="light">浅色</option><option value="dark">深色</option></select>
          <button id="reconnect" class="button secondary" type="button" hidden>重新连接</button>
          <button id="new-chat" class="button secondary" type="button">新建会话</button>
        </div>
      </header>
      <section id="timeline" class="timeline" aria-label="任务对话">
        <div id="welcome" class="welcome"><h2>今天想做点什么？</h2><p>描述任务，从当前项目开始。</p></div>
        <div id="messages" class="messages" role="log" aria-label="消息与工具过程" aria-live="polite"></div>
      </section>
      <div class="interaction-area">
        <section id="approval" class="approval" aria-labelledby="approval-title" hidden>
          <div class="approval-heading"><div><h2 id="approval-title">允许这次操作吗？</h2><p id="approval-tool"></p></div><span class="approval-badge">等待确认</span></div>
          <pre id="approval-command"></pre>
          <div class="approval-bottom"><p>请检查操作内容；修改和运行分别确认。</p><div class="approval-actions"><button id="deny" class="button secondary" type="button">拒绝</button><button id="allow" class="button primary" type="button">允许本次操作</button></div></div>
        </section>
        <p id="notice" class="notice" role="status">正在连接本地服务……</p>
        <form id="composer" class="composer">
          <label class="sr-only" for="prompt">任务内容</label>
          <textarea id="prompt" rows="2" maxlength="10000" placeholder="描述想交给 Agent 的任务……"></textarea>
          <div class="composer-bottom"><label class="read-policy"><input id="auto-read" type="checkbox" checked> 自动允许读取</label><div class="composer-actions"><button id="stop" class="button secondary" type="button" hidden>停止</button><button id="send" class="button primary" type="submit">发送任务 <span aria-hidden="true">↑</span></button></div></div>
        </form>
        <p id="usage" class="footnote">Enter 发送 · Shift + Enter 换行</p>
      </div>
    </main>
  </div>
</body>
</html>
