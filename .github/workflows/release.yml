name: Windows release

on:
  create:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'fa1lr4in/learn-agent' && startsWith(github.ref, 'refs/heads/release/')
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    env:
      DEEPSEEK_API_KEY: ""
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13.9"
          architecture: x64
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.16.0"
      - name: Validate release version
        run: |
          $version = (Get-Content -LiteralPath .\desktop\package.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+$' -or $env:GITHUB_REF_NAME -ne "release/$version") {
              throw 'Release branch must be release/<package version>.'
          }
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install locked dependencies
        run: |
          python -m venv .venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\.venv\Scripts\python.exe -m pip install --only-binary=:all: -r .\desktop\requirements-windows.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\.venv\Scripts\python.exe -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm.cmd ci --prefix .\desktop --no-audit --no-fund
          exit $LASTEXITCODE
      - name: Run automated checks
        run: |
          & .\.venv\Scripts\python.exe -B -X utf8 -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm.cmd test --prefix .\desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test .\tests\test_web_client.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\.venv\Scripts\python.exe -B -X utf8 tool_call.py --preview "只预览请求，不执行工具。"
          exit $LASTEXITCODE
      - name: Build and verify shipping runtime
        run: |
          npm.cmd run build:win --prefix .\desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm.cmd run test:package --prefix .\desktop
          exit $LASTEXITCODE
      - name: Upload, verify and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $tag = "v$env:RELEASE_VERSION"
          $installer = "learn-agent-Setup-$env:RELEASE_VERSION-x64.exe"
          $notes = @"
          learn-agent 是一个个人学习用的 toy 编程 Agent，能力很薄弱，只适合在临时项目中体验和阅读源码，不适合重要任务。

          包含命令行、本地网页和 Windows 桌面界面，支持文件搜索与编辑、差异确认、Python/测试命令执行、停止和会话恢复；默认接入 DeepSeek 官方 API，实际调用会产生费用。

          下载 $installer 和 SHA256SUMS.txt。安装包自带 Python 后端，不需要额外安装 Python 或 Node.js；用户项目的其他依赖需自行准备。

          验证范围：同版本程序已在开发者本机完成真实 DeepSeek 安装验收，包括编辑、两次运行确认、测试、历史恢复、拒绝和停止。此附件由 GitHub Actions 从提交 $env:GITHUB_SHA 重新构建，发布前运行自动化检查与自带运行时检查；与本机安装包不是同一次构建。云端附件尚未做人工安装验收。

          未验证：Windows 沙盒、其他干净机器及其他系统。按维护者决定直接发布，未将这些项目标为通过。

          已知限制：安装包未签名、没有自动更新，也没有操作系统沙箱；获准运行的代码使用当前账户权限。模型可能错误修改或执行操作，文件内容会发送给模型服务，本地日志可能包含源码。MCP 和扩展接入为实验性实现，三类小型任务的评测不能代表通用能力。
          "@
          $notes | Set-Content -LiteralPath .\build\release-notes.md -Encoding utf8
          $existing = gh release view $tag --json isDraft,targetCommitish 2>$null
          if ($LASTEXITCODE -eq 0) {
              $release = $existing | ConvertFrom-Json
              if (-not $release.isDraft -or $release.targetCommitish -ne $env:GITHUB_SHA) {
                  throw 'Refusing to replace a published release or another build draft.'
              }
          } else {
              gh release create $tag --draft --target $env:GITHUB_SHA --title "$tag - toy learning agent" --notes-file .\build\release-notes.md
              if ($LASTEXITCODE -ne 0) { throw 'Creating the release draft failed.' }
          }
          gh release upload $tag ".\dist\$installer" .\dist\SHA256SUMS.txt --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Uploading release assets failed; draft retained.' }
          gh release download $tag --pattern $installer --pattern SHA256SUMS.txt --dir .\build\release-download
          if ($LASTEXITCODE -ne 0) { throw 'Downloading uploaded assets for verification failed; draft retained.' }
          foreach ($name in @($installer, 'SHA256SUMS.txt')) {
              if ((Get-FileHash -LiteralPath ".\dist\$name").Hash -ne
                  (Get-FileHash -LiteralPath ".\build\release-download\$name").Hash) {
                  throw "Uploaded asset mismatch: $name. Draft retained."
              }
          }
          gh release edit $tag --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Publishing the verified draft failed.' }
          gh release view $tag --json url,isDraft,assets
          exit $LASTEXITCODE
