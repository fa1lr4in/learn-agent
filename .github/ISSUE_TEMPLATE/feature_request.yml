name: 功能建议
description: 从实际使用场景说明希望解决的问题。
body:
  - type: textarea
    id: problem
    attributes:
      label: 希望解决什么问题
      description: 描述实际场景、当前做法和遇到的限制。
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 期望的使用结果
      description: 描述用户如何操作，以及什么结果代表问题得到解决。
    validations:
      required: true
